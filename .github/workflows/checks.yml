name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python regression suite
        run: python -B -X utf8 -m unittest discover -v
      - name: Public content check
        run: python -B scripts/check_public_content.py
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check quota_simulator.js
          node --check kueue_quota.js
